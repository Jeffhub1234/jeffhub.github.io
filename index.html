<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musiclinq</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #efe9dd;
      --ink: #161513;
      --muted: #6b665d;
      --accent: #2f4fd1;
      --line: #161513;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Archivo", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.45;
      min-height: 100vh;
    }

    .wrap {
      max-width: 620px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      font-family: "DM Mono", monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 2px solid var(--line);
      padding-bottom: 10px;
      margin-bottom: 28px;
    }

    h1 {
      font-stretch: 62%;
      font-weight: 900;
      font-size: clamp(64px, 17vw, 128px);
      line-height: 0.85;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin: 0 0 14px;
    }


    .lead {
      font-size: 19px;
      max-width: 30ch;
      margin: 0 0 40px;
    }

    form {
      display: grid;
      gap: 22px;
    }

    label {
      display: block;
      font-family: "DM Mono", monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      font: inherit;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 2px solid var(--line);
      border-radius: 0;
      padding: 6px 0 8px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    select {
      cursor: pointer;
      background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%),
                        linear-gradient(135deg, var(--ink) 50%, transparent 50%);
      background-position: calc(100% - 12px) 55%, calc(100% - 6px) 55%;
      background-size: 6px 6px;
      background-repeat: no-repeat;
      padding-right: 28px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
      border: 2px solid var(--line);
      padding: 10px;
    }

    input::placeholder,
    textarea::placeholder { color: #9a948a; }

    input:focus,
    select:focus { border-bottom-color: var(--accent); }
    textarea:focus { border-color: var(--accent); }

    .check {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      text-transform: none;
      letter-spacing: 0;
      color: var(--ink);
      margin: 0;
    }

    .check input {
      flex: none;
      width: 22px;
      height: 22px;
      margin-top: 1px;
      padding: 0;
      border: 2px solid var(--line);
      cursor: pointer;
      display: grid;
      place-content: center;
    }

    .check input::before {
      content: "";
      width: 10px;
      height: 10px;
      background: var(--paper);
      transform: scale(0);
      transition: transform 0.1s;
    }

    .check input:checked { background: var(--ink); }
    .check input:checked::before { transform: scale(1); }
    .check input:focus-visible { border-color: var(--accent); }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    button {
      justify-self: start;
      font: inherit;
      font-weight: 800;
      font-stretch: 80%;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--paper);
      background: var(--ink);
      border: 2px solid var(--ink);
      padding: 14px 26px;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.12s, border-color 0.12s;
    }

    button:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    button:active { transform: translateY(1px); }

    #message {
      font-family: "DM Mono", monospace;
      font-size: 14px;
      min-height: 1.4em;
      margin: 18px 0 0;
    }

    #message:not(:empty)::before {
      content: "→ ";
      color: var(--accent);
    }

    footer {
      margin-top: 64px;
      padding-top: 10px;
      border-top: 2px solid var(--line);
      font-family: "DM Mono", monospace;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .wrap { padding-top: 28px; }
      .row { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <div class="top">
      <span>Musiclinq</span>
      <span>Venteliste</span>
    </div>

    <h1>Musiclinq</h1>
    <p class="lead">Skriv dig op, så hører du fra os, når vi åbner.</p>

    <form id="signupForm">
      <div class="row">
        <div>
          <label for="navn">Navn</label>
          <input type="text" id="navn" placeholder="Dit navn" required>
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="dig@mail.dk" required>
        </div>
      </div>

      <div>
        <label for="aktivitet">Hvad vil du bruge Musiclinq til?</label>
        <select id="aktivitet">
          <option value="">Vælg</option>
          <option value="tilbyde">Tilbyde ydelser</option>
          <option value="koebe">Købe ydelser</option>
          <option value="begge">Begge dele</option>
        </select>
      </div>

      <div>
        <label for="beskaeftigelse">Beskæftigelse</label>
        <select id="beskaeftigelse">
          <option value="">Vælg</option>
          <option value="musiker">Musiker / artist</option>
          <option value="producer">Producer / lydtekniker</option>
          <option value="underviser">Musikunderviser</option>
          <option value="branche">Arbejder i musikbranchen (label, booking, management)</option>
          <option value="studerende">Studerende</option>
          <option value="hobby">Hobbymusiker</option>
          <option value="andet">Andet</option>
        </select>
      </div>

      <div>
        <label for="interesse">Hvilke ydelser interesserer dig?</label>
        <input type="text" id="interesse" placeholder="Fx mix, master, undervisning">
      </div>

      <div>
        <label for="hort_fra">Hvor har du hørt om os?</label>
        <input type="text" id="hort_fra" placeholder="Instagram, en ven, ...">
      </div>

      <div>
        <label for="comment">Kommentar (valgfri)</label>
        <textarea id="comment"></textarea>
      </div>

      <label class="check">
        <input type="checkbox" id="mail_ved_launch">
        <span>Ja tak, I må gerne sende mig en mail, når Musiclinq launcher.</span>
      </label>

      <button type="submit">Skriv mig op</button>
    </form>

    <p id="message"></p>

    <footer>&copy; Musiclinq</footer>
  </main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://xcedzljfmwhxjfevtpuv.supabase.co"
  const SUPABASE_KEY = "sb_publishable_QWdeN528NVZewIpYEJYwwQ_22X17M7w"

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  )

  const form = document.getElementById("signupForm")
  const message = document.getElementById("message")

  form.addEventListener("submit", async function(event) {
    event.preventDefault()

    const data = {
      navn: document.getElementById("navn").value,
      email: document.getElementById("email").value,
      aktivitet: document.getElementById("aktivitet").value,
      beskaeftigelse: document.getElementById("beskaeftigelse").value,
      interesse: document.getElementById("interesse").value,
      hort_fra: document.getElementById("hort_fra").value,
      comment: document.getElementById("comment").value,
      mail_ved_launch: document.getElementById("mail_ved_launch").checked
    }

    const { error } = await supabaseClient
      .from("signups")
      .insert([data])

    if (error) {
      console.error(error)

      if (error.code === "23505") {
        message.textContent = "Denne email er allerede skrevet op."
      } else {
        message.textContent = "Der skete en fejl. Prøv igen."
      }
    } else {
      window.location.href = "tak.html"
    }
  })
</script>

</body>

</html>
