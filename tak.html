<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tak – Musiclinq</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #efe9dd;
      --ink: #161513;
      --muted: #6b665d;
      --accent: #2f4fd1;
      --line: #161513;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Archivo", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.45;
      min-height: 100vh;
    }

    .wrap {
      max-width: 620px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      font-family: "DM Mono", monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 2px solid var(--line);
      padding-bottom: 10px;
      margin-bottom: 28px;
    }

    h1 {
      font-stretch: 62%;
      font-weight: 900;
      font-size: clamp(64px, 17vw, 128px);
      line-height: 0.85;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin: 0 0 18px;
    }

    .lead {
      font-size: 19px;
      max-width: 30ch;
      margin: 0 0 40px;
    }

    a.back {
      display: inline-block;
      font-family: "DM Mono", monospace;
      font-size: 14px;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 2px;
    }

    a.back:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    footer {
      margin-top: 64px;
      padding-top: 10px;
      border-top: 2px solid var(--line);
      font-family: "DM Mono", monospace;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .wrap { padding-top: 28px; }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <div class="top">
      <span>Musiclinq</span>
      <span>Tak for hjælpen</span>
    </div>

    <h1>Tak!</h1>
    <p class="lead">Du er skrevet op – tusind tak, fordi du hjælper os med projektet.</p>


    <footer>&copy; Musiclinq</footer>
  </main>

</body>

</html>
